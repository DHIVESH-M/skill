
[project]
name = "skillpath-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.7",
    "uvicorn[standard]==0.54.0",
    "supabase==2.34.1",
    "google-genai==3.3.0",
    "langgraph==1.2.22",
    "python-dotenv==1.2.4",
    "pydantic==2.14.3",
    "cryptography==50.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 280

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E701", "E702", "E401", "B008", "E731"]
